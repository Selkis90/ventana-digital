<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ventana Digital - Videollamada</title>
    <link rel="stylesheet" href="css/estilos.css">
    
    <!-- Meta para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- CONTENEDOR DE VIDEOS EN CUADRÍCULA -->
    <div id="grid-videos">
        <!-- Los videos se generarán dinámicamente -->
    </div>
    
    <!-- ESTADO -->
    <div id="estado" class="inicializando">🔄 Inicializando...</div>
    
    <!-- CONTROLES -->
    <div id="controles">
        <!-- Fila 1: Controles de audio/video -->
        <div class="control-group">
            <button id="btn-microfono" class="btn-control" title="Activar/Desactivar micrófono">🎤 Micrófono</button>
            <button id="btn-camara" class="btn-control" title="Activar/Desactivar cámara">📷 Cámara</button>
            <button id="btn-silenciar" class="btn-control" title="Silenciar audio remoto">🔇 Silenciar</button>
        </div>
        
        <!-- Fila 2: Volumen -->
        <div class="control-group">
            <label for="volumen" class="label-volumen">🔊</label>
            <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.3">
            <span id="volumen-label" class="volumen-text">30%</span>
        </div>
        
        <!-- Fila 3: Acciones -->
        <div class="control-group">
            <button id="btn-fullscreen" class="btn-control" title="Pantalla completa">⛶ Pantalla completa</button>
            <button id="btn-reconectar" class="btn-control" title="Reconectar">🔄 Reconectar</button>
            <button id="btn-diagnostico" class="btn-control" title="Diagnóstico">📊 Diagnóstico</button>
        </div>
        
        <!-- Fila 4: Info de conexión -->
        <div id="info-conexion" class="info-conexion">
            <span id="mi-id">ID: Conectando...</span>
            <span id="peer-conectado">Peer: Ninguno</span>
        </div>
    </div>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- CAMARA JS -->
    <script src="js/camara.js"></script>
</body>
</html>
