<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ventana Digital - Videollamada</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="grid-videos"></div>
    <div id="estado" class="inicializando">🔄 Inicializando...</div>
    
    <div id="controles">
        <button id="btn-microfono" class="btn-control">🎤 Micrófono</button>
        <button id="btn-camara" class="btn-control">📷 Cámara</button>
        <button id="btn-silenciar" class="btn-control">🔇 Silenciar</button>
        <button id="btn-fullscreen" class="btn-control">⛶ Pantalla completa</button>
        <button id="btn-reconectar" class="btn-control">🔄 Reconectar</button>
        <button id="btn-diagnostico" class="btn-control">📊 Diagnóstico</button>
    </div>

    <div id="info-conexion" class="info-conexion">
        <span id="mi-id">ID: Conectando...</span>
        <span id="peer-conectado">Peer: Ninguno</span>
    </div>

    <!-- 🔥 1. Cargar Socket.IO PRIMERO (Para que el servidor siga funcionando) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- 🔥 2. Cargar LiveKit Client desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@1.8.0/dist/livekit-client.umd.min.js"></script>
    
    <!-- 🔥 3. Cargar el camara.js (que usa ambos) -->
    <script src="js/camara.js"></script>
</body>
</html>
