<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana Digital - Videollamada</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- VIDEO REMOTO (PANTALLA GRANDE - FONDO) -->
    <video id="video-remoto" autoplay playsinline></video>
    
    <!-- VIDEO LOCAL (PANTALLA PEQUEÑA - ESQUINA) -->
    <video id="video" autoplay playsinline muted></video>
    
    <!-- ESTADO -->
    <div id="estado" class="inicializando">🔄 Inicializando...</div>
    
    <!-- 🔥 BOTÓN PARA ACTIVAR AUDIO -->
    <button id="btn-activar-audio" style="position:fixed;bottom:180px;left:50%;transform:translateX(-50%);z-index:1000;padding:16px 40px;background:#00aaff;color:#fff;border:none;border-radius:16px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 4px 40px rgba(0,170,255,0.6);transition:all 0.3s ease;display:none;font-family:Arial,sans-serif;">
        🔊 Activar Audio
    </button>
    
    <!-- CONTROLES -->
    <div id="controles">
        <div class="control-group">
            <label for="volumen">🔊 Volumen:</label>
            <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.5">
            <span id="volumen-label">50%</span>
        </div>
        <div class="control-group">
            <button id="btn-silenciar">🔇 Silenciar</button>
            <button id="btn-reconectar" onclick="forzarReconexion()">🔄 Reconectar</button>
            <button id="btn-diagnostico" onclick="estadoConexiones()">📊 Diagnóstico</button>
        </div>
    </div>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- CAMARA JS -->
    <script src="js/camara.js"></script>
</body>
</html>
