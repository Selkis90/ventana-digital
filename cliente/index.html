<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ventana Digital Pro</title>
    
    <!-- LiveKit CDN -->
    <script src="https://cdn.livekit.io/livekit/livekit-latest.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">Conectando...</div>
            <div class="loading-subtext">Ventana Digital Pro</div>
        </div>
    </div>

    <!-- GRID DE VIDEOS -->
    <div id="grid-videos"></div>

    <!-- ESTADO DE CONEXIÓN -->
    <div id="estado">
        <span class="estado-indicador"></span>
        <span class="estado-texto">Conectando...</span>
    </div>

    <!-- PANEL DE CONTROLES -->
    <div id="panel-controles">
        <div class="panel-inner">
            <!-- Fila superior -->
            <div class="controles-fila">
                <button class="btn-control" id="btn-microfono" title="Micrófono">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>

                <button class="btn-control" id="btn-camara" title="Cámara">
                    <svg viewBox="0 0 24 24">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </button>

                <button class="btn-control" id="btn-silenciar" title="Silenciar 5s">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>

                <span class="separador"></span>

                <button class="btn-control" id="btn-compartir" title="Compartir pantalla">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/>
                        <path d="M16 3h5v5"/>
                        <path d="M21 3l-9 9"/>
                    </svg>
                </button>

                <button class="btn-control" id="btn-fullscreen" title="Pantalla completa">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 3h6v6"/>
                        <path d="M9 21H3v-6"/>
                        <path d="M21 3l-7 7"/>
                        <path d="M3 21l7-7"/>
                    </svg>
                </button>

                <button class="btn-control" id="btn-reconectar" title="Reconectar">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
                    </svg>
                </button>
            </div>

            <!-- Fila inferior -->
            <div class="controles-fila-inferior">
                <div class="control-volumen">
                    <span class="icono-volumen">🔊</span>
                    <input type="range" id="volumen" min="0" max="1" step="0.01" value="1.0">
                    <span class="texto-volumen" id="volumen-label">100%</span>
                </div>

                <span class="separador"></span>

                <div class="info-conexion">
                    <span class="info-item">
                        🆔 <span class="info-valor" id="mi-id">---</span>
                    </span>
                    <span class="info-divider"></span>
                    <span class="info-item">
                        👥 <span class="info-valor" id="peer-conectado">0</span>
                    </span>
                    <span class="info-divider"></span>
                    <span class="info-item">
                        📶 <span class="info-valor" id="calidad-red">Excelente</span>
                    </span>
                </div>

                <span class="separador"></span>

                <button class="btn-diagnostico" id="btn-diagnostico" title="Diagnóstico">🩺</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/camara.js"></script>
</body>
</html>
