<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana Digital - Videollamada</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- VIDEO REMOTO (PANTALLA GRANDE - FONDO) -->
    <video id="video-remoto" autoplay playsinline></video>
    
    <!-- VIDEO LOCAL (PANTALLA PEQUEÑA - ESQUINA) -->
    <video id="video" autoplay playsinline muted></video>
    
    <!-- ESTADO -->
    <div id="estado" class="inicializando">🔄 Inicializando...</div>
    
    <!-- CONTROLES (COMO ZOOM) -->
    <div id="controles">
        <div class="control-group">
            <label for="volumen">🔊 Volumen:</label>
            <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.4">
            <span id="volumen-label">40%</span>
        </div>
        <div class="control-group">
            <button id="btn-silenciar">🔇 Silenciar</button>
            <button id="btn-reconectar">🔄 Reconectar</button>
            <button id="btn-diagnostico" onclick="estadoConexiones()">📊 Diagnóstico</button>
        </div>
    </div>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- CAMARA JS -->
    <script src="js/camara.js"></script>
</body>
</html>
