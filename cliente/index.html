<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ventana Digital - Videollamada Pro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="grid-videos"></div>
    
    <div id="estado" class="inicializando">🔄 Inicializando...</div>

    <!-- 🔥 CONTROLES FLOTANTES -->
    <div id="controles">
        <div class="control-group">
            <button id="btn-microfono" class="btn-control" title="Micrófono">🎤</button>
            <button id="btn-camara" class="btn-control" title="Cámara">📷</button>
            <button id="btn-silenciar" class="btn-control" title="Silenciar todo">🔇</button>
        </div>
        
        <div class="control-group">
            <label for="volumen" class="label-volumen">🔊</label>
            <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.3">
            <span id="volumen-label" class="volumen-text">30%</span>
        </div>

        <div class="control-group">
            <button id="btn-fullscreen" class="btn-control" title="Pantalla completa">⛶</button>
            <button id="btn-reconectar" class="btn-control" title="Reconectar">🔄</button>
            <button id="btn-diagnostico" class="btn-control" title="Diagnóstico">📊</button>
        </div>

        <div id="info-conexion" class="info-conexion">
            <span id="mi-id">ID: Conectando...</span>
            <span id="peer-conectado">Peer: Ninguno</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@1.8.0/dist/livekit-client.umd.min.js"></script>
    <script src="js/camara.js"></script>
    
    <!-- PING PARA EVITAR QUE RENDER SE DUERMA -->
    <script>
        setInterval(() => {
            fetch('/health').catch(() => {});
        }, 300000);
    </script>
</body>
</html>
