# Render Blueprint — este archivo va en la RAÍZ del repositorio
# (Si tu servicio ya existe en Render, basta con poner las variables en el panel.)
services:
  - type: web
    name: ventana-digital
    runtime: node
    plan: free
    buildCommand: npm install --prefix servidor --omit=dev
    startCommand: node servidor/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DEFAULT_ROOM
        value: sala-principal
      - key: CALIDAD
        value: normal
      - key: MAX_PARTICIPANTES
        value: "6"
      - key: ZONA_HORARIA
        value: America/Bogota
      # Estos se llenan en el panel de Render (no se guardan en el repo)
      - key: CF_APP_ID
        sync: false
      - key: CF_APP_TOKEN
        sync: false
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_KEY_TOKEN
        sync: false
      - key: HORARIO
        sync: false
